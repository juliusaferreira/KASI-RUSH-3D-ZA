<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <radialGradient id="spray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with Safe Padding for Maskable Icons -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Railway track perspective lines in background -->
  <path d="M 120 480 L 220 220 L 292 220 L 392 480 Z" fill="#1e293b" opacity="0.6"/>
  <line x1="140" y1="440" x2="372" y2="440" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="380" x2="342" y2="380" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <line x1="195" y1="320" x2="317" y2="320" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <line x1="212" y1="270" x2="300" y2="270" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Rails -->
  <line x1="120" y1="480" x2="220" y2="220" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <line x1="392" y1="480" x2="292" y2="220" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>

  <!-- Spray burst glow behind can -->
  <circle cx="256" cy="190" r="140" fill="url(#spray)" filter="url(#glow)" />

  <!-- Iconic Spray Paint Can (Kasi Rush signature icon) -->
  <g filter="url(#glow)">
    <!-- Can Nozzle -->
    <rect x="238" y="112" width="36" height="28" rx="6" fill="#f8fafc" />
    <rect x="228" y="128" width="12" height="8" rx="2" fill="#38bdf8" />
    <path d="M 230 140 L 282 140 L 290 165 L 222 165 Z" fill="#cbd5e1" />
    
    <!-- Can Body -->
    <rect x="206" y="165" width="100" height="175" rx="14" fill="url(#canGrad)" />
    
    <!-- SA Flag Color Chevron Stripes on Can -->
    <!-- Green Y band with black triangle & gold border -->
    <path d="M 206 210 L 256 240 L 206 270 Z" fill="#000000" />
    <path d="M 206 200 L 268 240 L 206 280" fill="none" stroke="#eab308" stroke-width="6" stroke-linejoin="round" />
    <path d="M 206 190 L 280 240 L 306 240 L 306 215 L 270 215 L 206 175 Z" fill="#059669" />
    <path d="M 206 305 L 280 255 L 306 255 L 306 280 L 270 280 L 206 320 Z" fill="#2563eb" />

    <!-- Can Cap/Base -->
    <ellipse cx="256" cy="340" rx="50" ry="12" fill="#991b1b" />
    <ellipse cx="256" cy="165" rx="50" ry="12" fill="#ef4444" />
  </g>

  <!-- Big Gold Coin with South African Springbok / Star Emblem -->
  <g transform="translate(290, 260)" filter="url(#glow)">
    <circle cx="70" cy="70" r="65" fill="url(#goldGrad)" stroke="#78350f" stroke-width="5" />
    <circle cx="70" cy="70" r="52" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="10 6" />
    <!-- Star / Mzansi mark -->
    <polygon points="70,30 81,55 108,55 86,72 94,98 70,82 46,98 54,72 32,55 59,55" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  </g>

  <!-- Kasi Rush stylized title badge -->
  <g transform="translate(256, 420)">
    <!-- Background plaque -->
    <rect x="-170" y="-32" width="340" height="64" rx="20" fill="#0f172a" stroke="#eab308" stroke-width="4" filter="url(#glow)"/>
    <text x="0" y="8" font-family="'Impact', 'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      KASI RUSH
    </text>
    <text x="0" y="24" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="3">
      SOUTH AFRICA
    </text>
  </g>
</svg>
