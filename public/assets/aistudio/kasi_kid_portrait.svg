<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Kasi Rush — Kasi Kid portrait (comic / low-poly style, matches the in-game 3D model) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a05f2c"/>
      <stop offset="1" stop-color="#8d5524"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- subtle township skyline silhouette -->
  <g fill="#1e293b" opacity="0.9">
    <rect x="18" y="356" width="70" height="90"/>
    <polygon points="88,446 88,380 118,364 148,380 148,446"/>
    <rect x="150" y="396" width="58" height="50"/>
    <rect x="360" y="388" width="64" height="58"/>
    <polygon points="424,446 424,372 452,356 480,372 480,446"/>
    <rect x="482" y="404" width="30" height="42"/>
  </g>
  <g stroke="#f59e0b" stroke-width="3" opacity="0.55">
    <line x1="0" y1="336" x2="512" y2="336"/>
  </g>

  <!-- ============ BODY ============ -->
  <!-- shoulders / arms (skin) -->
  <path d="M118 470 Q120 380 168 352 L226 352 L226 470 Z" fill="url(#skin)"/>
  <path d="M394 470 Q392 380 344 352 L286 352 L286 470 Z" fill="url(#skin)"/>
  <!-- white wristbands -->
  <rect x="122" y="428" width="42" height="26" rx="12" fill="#f8fafc"/>
  <rect x="348" y="428" width="42" height="26" rx="12" fill="#f8fafc"/>

  <!-- torso: orange tank -->
  <path d="M158 470 L166 356 Q256 336 346 356 L354 470 Z" fill="url(#tank)"/>
  <!-- yellow athletic side stripes -->
  <path d="M166 360 L162 470 L178 470 L182 362 Z" fill="#fde047"/>
  <path d="M346 360 L350 470 L334 470 L330 362 Z" fill="#fde047"/>
  <!-- white chest stripe -->
  <rect x="158" y="386" width="196" height="16" fill="#f8fafc"/>
  <!-- race plate -->
  <rect x="222" y="412" width="68" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="236" y="424" width="40" height="9" rx="3" fill="#f97316"/>
  <rect x="236" y="440" width="40" height="9" rx="3" fill="#f97316"/>
  <!-- gold chain necklace -->
  <path d="M196 352 Q256 396 316 352" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="384" r="9" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
  <!-- denim shorts top edge -->
  <path d="M150 470 L362 470 L362 500 L150 500 Z" fill="url(#denim)"/>
  <rect x="150" y="470" width="12" height="30" fill="#f8fafc"/>
  <rect x="350" y="470" width="12" height="30" fill="#f8fafc"/>

  <!-- ============ HEAD ============ -->
  <g>
    <!-- neck -->
    <rect x="236" y="300" width="40" height="40" fill="#7c4a1e"/>
    <!-- head -->
    <ellipse cx="256" cy="220" rx="86" ry="92" fill="url(#skin)"/>
    <!-- ears -->
    <circle cx="170" cy="228" r="15" fill="#8d5524"/>
    <circle cx="342" cy="228" r="15" fill="#8d5524"/>
    <!-- black hair tuft poking out front under cap -->
    <path d="M218 168 Q256 150 294 168 L288 186 Q256 172 224 186 Z" fill="#17120f"/>

    <!-- backwards red snapback: dome -->
    <path d="M166 178 Q256 96 346 178 L346 196 Q256 168 166 196 Z" fill="url(#cap)"/>
    <!-- cap button -->
    <circle cx="256" cy="128" r="10" fill="#f8fafc"/>
    <!-- backwards brim (pointing back-right) -->
    <path d="M340 190 Q392 186 404 214 Q384 228 338 220 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="4"/>
    <!-- white logo patch on cap side -->
    <rect x="196" y="160" width="42" height="24" rx="4" fill="#f8fafc" transform="rotate(-10 217 172)"/>
    <path d="M205 178 l10 -12 l6 8 l8 -12" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round" transform="rotate(-10 217 172)"/>

    <!-- comic eyes -->
    <g>
      <ellipse cx="222" cy="232" rx="17" ry="21" fill="#ffffff"/>
      <ellipse cx="290" cy="232" rx="17" ry="21" fill="#ffffff"/>
      <circle cx="226" cy="236" r="9" fill="#0f172a"/>
      <circle cx="286" cy="236" r="9" fill="#0f172a"/>
      <circle cx="229" cy="232" r="3.4" fill="#ffffff"/>
      <circle cx="289" cy="232" r="3.4" fill="#ffffff"/>
      <!-- bold brows -->
      <path d="M204 204 Q222 196 240 204" stroke="#17120f" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M272 204 Q290 196 308 204" stroke="#17120f" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
    <!-- nose -->
    <path d="M252 250 Q248 262 256 266" stroke="#6b3f18" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- big smile -->
    <path d="M222 276 Q256 306 290 276 Q256 292 222 276 Z" fill="#ffffff" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- comic outline accents -->
  <path d="M166 356 Q256 336 346 356" fill="none" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</svg>
