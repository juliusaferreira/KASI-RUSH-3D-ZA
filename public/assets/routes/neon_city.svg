<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <!-- Neon City route preview — dark night, bright lights -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.7" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e0e7ff">
    <circle cx="40" cy="30" r="1.4"/><circle cx="120" cy="18" r="1"/><circle cx="200" cy="26" r="1.2"/>
    <circle cx="300" cy="16" r="1"/><circle cx="360" cy="34" r="1.3"/><circle cx="80" cy="48" r="0.9"/>
    <circle cx="255" cy="42" r="1"/><circle cx="330" cy="52" r="0.9"/>
  </g>

  <!-- moon -->
  <circle cx="345" cy="38" r="14" fill="#e2e8f0"/>
  <circle cx="340" cy="34" r="3" fill="#cbd5e1"/>
  <circle cx="350" cy="44" r="2" fill="#cbd5e1"/>

  <!-- back skyline silhouettes -->
  <g fill="#141b34">
    <rect x="10" y="70" width="34" height="110"/>
    <rect x="60" y="95" width="28" height="85"/>
    <rect x="120" y="60" width="40" height="120"/>
    <rect x="180" y="88" width="30" height="92"/>
    <rect x="235" y="66" width="38" height="114"/>
    <rect x="300" y="92" width="30" height="88"/>
    <rect x="355" y="76" width="34" height="104"/>
  </g>

  <!-- neon window bands on towers -->
  <g>
    <rect x="12" y="82" width="30" height="3" fill="#22d3ee"/><rect x="12" y="100" width="30" height="3" fill="#a855f7"/>
    <rect x="62" y="108" width="24" height="3" fill="#f472b6"/><rect x="62" y="126" width="24" height="3" fill="#22d3ee"/>
    <rect x="122" y="74" width="36" height="3" fill="#a855f7"/><rect x="122" y="94" width="36" height="3" fill="#4ade80"/><rect x="122" y="114" width="36" height="3" fill="#22d3ee"/>
    <rect x="182" y="100" width="26" height="3" fill="#22d3ee"/><rect x="182" y="120" width="26" height="3" fill="#f472b6"/>
    <rect x="237" y="80" width="34" height="3" fill="#4ade80"/><rect x="237" y="100" width="34" height="3" fill="#a855f7"/>
    <rect x="302" y="104" width="26" height="3" fill="#a855f7"/><rect x="302" y="122" width="26" height="3" fill="#22d3ee"/>
    <rect x="357" y="90" width="30" height="3" fill="#f472b6"/><rect x="357" y="110" width="30" height="3" fill="#22d3ee"/>
  </g>

  <!-- antenna spires with beacons -->
  <g stroke="#1e293b" stroke-width="3">
    <line x1="140" y1="60" x2="140" y2="44"/><line x1="253" y1="66" x2="253" y2="48"/>
  </g>
  <circle cx="140" cy="42" r="3.2" fill="#f472b6"/>
  <circle cx="253" cy="46" r="3.2" fill="#22d3ee"/>

  <!-- foreground buildings with neon signs -->
  <g>
    <rect x="30" y="130" width="52" height="80" fill="#1e293b"/>
    <rect x="30" y="130" width="52" height="6" fill="#22d3ee"/>
    <text x="56" y="172" font-family="monospace" font-size="14" font-weight="bold" fill="#a855f7" text-anchor="middle">ネオン</text>
    <rect x="46" y="186" width="20" height="24" fill="#0f172a"/>
    <rect x="150" y="118" width="58" height="92" fill="#1e293b"/>
    <rect x="150" y="118" width="58" height="6" fill="#f472b6"/>
    <text x="179" y="162" font-family="monospace" font-size="14" font-weight="bold" fill="#22d3ee" text-anchor="middle">電光</text>
    <rect x="167" y="178" width="24" height="32" fill="#0f172a"/>
    <rect x="285" y="126" width="56" height="84" fill="#1e293b"/>
    <rect x="285" y="126" width="56" height="6" fill="#4ade80"/>
    <text x="313" y="168" font-family="monospace" font-size="14" font-weight="bold" fill="#f472b6" text-anchor="middle">光都</text>
    <rect x="301" y="184" width="24" height="26" fill="#0f172a"/>
  </g>

  <!-- wet street reflection -->
  <rect x="0" y="210" width="400" height="40" fill="#0b1026"/>
  <g opacity="0.4">
    <rect x="30" y="212" width="52" height="6" fill="#22d3ee"/>
    <rect x="150" y="212" width="58" height="6" fill="#f472b6"/>
    <rect x="285" y="212" width="56" height="6" fill="#4ade80"/>
    <ellipse cx="56" cy="226" rx="26" ry="3" fill="#22d3ee" opacity="0.5"/>
    <ellipse cx="179" cy="232" rx="30" ry="3.4" fill="#f472b6" opacity="0.5"/>
    <ellipse cx="313" cy="224" rx="28" ry="3" fill="#4ade80" opacity="0.5"/>
  </g>

  <!-- track leading to horizon -->
  <polygon points="150,210 250,210 236,250 164,250" fill="url(#track)"/>
  <line x1="180" y1="210" x2="176" y2="250" stroke="#22d3ee" stroke-width="2.5" opacity="0.85"/>
  <line x1="220" y1="210" x2="224" y2="250" stroke="#22d3ee" stroke-width="2.5" opacity="0.85"/>
  <g fill="#a855f7" opacity="0.9">
    <rect x="147" y="214" width="6" height="4"/><rect x="247" y="214" width="6" height="4"/>
    <rect x="150" y="226" width="6" height="4"/><rect x="244" y="226" width="6" height="4"/>
    <rect x="154" y="238" width="6" height="4"/><rect x="240" y="238" width="6" height="4"/>
  </g>
</svg>
